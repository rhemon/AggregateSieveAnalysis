plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.rhemon.aggregatesieveanalysis'
    compileSdk 36

    def uploadKeystore = System.getenv('ASA_UPLOAD_KEYSTORE')
    def uploadPassword = System.getenv('ASA_UPLOAD_PASSWORD')
    if (uploadKeystore && uploadPassword) {
        signingConfigs {
            release {
                storeFile file(uploadKeystore)
                storePassword uploadPassword
                keyAlias 'asa2-upload'
                keyPassword uploadPassword
            }
        }
    }

    defaultConfig {
        applicationId 'io.github.rhemon.aggregatesieveanalysis.relaunch'
        minSdk 13
        targetSdk 36
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            if (uploadKeystore && uploadPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
